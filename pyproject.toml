[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipscribe-local"
version = "0.1.0.dev0"
description = "A local-first video subtitling pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "clipscribe-local contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
